<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giao tiếp với bệnh nhân</title>
<meta http-equiv="refresh" content="0; url=app/">
<script>
if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(!/\/app\/$/.test(r.scope))r.unregister();});});}
location.replace("app/");
</script></head>
<body><p>Đang chuyển tới <a href="app/">app/</a>…</p></body></html>
